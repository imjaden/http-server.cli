name: http-server.cli
version: 1.4.1
description: 基于 python3 -m http.server 的本地 HTTP 服务管理器。自动分配端口、追踪项目映射、管理服务生命周期、智能首页跳转、进程资源监控。
date: 2026-06-23
author: IRIS

metadata:
  source: src/http_server_cli/
  tests: tests/

capabilities:
  - service-lifecycle
  - port-allocation
  - registry
  - configuration
  - cli-interface
  - smart-homepage
  - resource-monitoring
  - logging
  - bookmark
  - http-serving
  - registry-managed
  - dashboard
  - mcp-integration
  - json-output
  - url-flag
  - glob-resolution
  - data-migration

specs:

  # ── 服务生命周期 ──────────────────────────────────

  service-lifecycle:
    purpose: HTTP 服务的启动、查询、关闭全生命周期管理
    requirements:
      - id: lifecycle-01
        name: 启动服务
        description: start 命令应能在指定路径上启动 HTTP 服务，支持普通和 daemon 两种模式
        priority: MUST
        scenarios:
          - name: 默认路径启动
            given: 端口 8080 空闲
            when: 执行 hs start
            then:
              - 在默认端口 8080 上启动 HTTP 服务
              - 将服务注册到 registry

          - name: daemon 模式启动
            given: 端口 8080 空闲
            when: 执行 hs start . -d
            then:
              - 服务启动后进入 tail -f 日志查看
              - Ctrl+C 时日志查看停止，服务仍在后台运行
              - registry 条目 daemon 字段为 true

          - name: 指定路径启动
            given: 端口 8080 空闲，路径 /tmp/project 存在
            when: 执行 hs start /tmp/project
            then:
              - 在 /tmp/project 目录启动服务
              - 注册表记录 path 为 /private/tmp/project

          - name: 路径不存在
            given: 路径 /nonexistent 不存在
            when: 执行 hs start /nonexistent
            then:
              - 输出路径不存在提示
              - registry 不写入任何条目

          - name: 启动后打开浏览器
            given: 端口 8080 空闲
            when: 执行 hs start . -o
            then: 启动服务后自动打开 http://localhost:8080

      - id: lifecycle-02
        name: 列出服务
        description: list 命令应展示所有已注册服务及其状态
        priority: MUST
        scenarios:
          - name: 无服务时
            given: registry 为空
            when: 执行 hs list
            then: 输出"没有正在运行的 HTTP 服务"

          - name: 有已注册服务
            given: registry 中存在一条有效记录
            when: 执行 hs list
            then: 输出包含端口、路径、PID、状态

      - id: lifecycle-03
        name: 查询状态
        description: status 命令应查询指定端口或路径的服务状态
        priority: MUST
        scenarios:
          - name: 按端口查询已注册服务
            given: 端口 8080 已注册且存活
            when: 执行 hs status 8080
            then: 输出"运行中"及相关信息

          - name: 查询未注册端口
            given: 端口 9999 未注册
            when: 执行 hs status 9999
            then: 输出"未注册"

          - name: 无参数时等同于 list
            when: 执行 hs status
            then: 输出与 list 相同的服务列表

      - id: lifecycle-04
        name: 关闭服务
        description: kill 命令应按端口或路径关闭服务，并从 registry 移除
        priority: MUST
        scenarios:
          - name: 按端口关闭
            given: 端口 8080 已注册
            when: 执行 hs kill 8080
            then:
              - 终止该端口的服务进程
              - registry 中对应记录被删除

          - name: 按路径关闭
            given: 路径 /tmp/project 已注册
            when: 执行 hs kill /tmp/project
            then:
              - 终止该路径对应的服务
              - registry 中对应记录被删除

          - name: 关闭未注册端口
            given: 端口 9999 未注册
            when: 执行 hs kill 9999
            then: 输出"未注册"提示

          - name: 关闭所有服务
            given: registry 中有 2 条记录
            when: 执行 hs kill-all
            then:
              - 所有服务进程被终止
              - registry 被清空

      - id: lifecycle-05
        name: 退出码三态与返回契约
        description: 0=成功（含幂等命中）· 1=运行期失败（路径不存在/端口不可用/未注册）· 2=用法错误（非法值/越界/互斥）；HTTP-SERVER-CL003 / D14
        priority: MUST
        scenarios:
          - name: 路径不存在
            given: 路径 /nonexistent 不存在
            when: 执行 hs /nonexistent
            then: 输出错误提示，退出码 1（修前为 0，属「假成功」）

          - name: 参数错误
            given: -p 取值非整数
            when: 执行 hs start . -p abc
            then:
              - argparse 错误（stderr）
              - 退出码 2

          - name: kill 未注册端口
            given: 端口 59999 未注册
            when: 执行 hs kill 59999
            then:
              - 输出 "Port 59999 not registered"
              - 退出码 1（hs status 查询仍为 0）

          - name: 成功与幂等命中
            when: 执行 hs start .（新建）后再次执行（幂等命中）
            then: 两次均为退出码 0

      - id: lifecycle-06
        name: 启动竞态防护（宽限 + 归属校验）
        description: 同目录并发启动时以 ≤1.0s 宽限识别「启动中」，判 stale 时先终止本工具进程组再清登记；stale 文案三态一律 stderr（HTTP-SERVER-CL004 / D4 / D6）
        priority: MUST
        scenarios:
          - name: 同目录 100ms 内连续两次启动
            given: 无该目录的服务在运行
            when: 先后（间隔 <100ms）执行两次 hs <dir> -d --url
            then:
              - 两次输出同一 URL（第二次幂等命中，不判 stale）
              - registry 中该 path 仅 1 条
              - 该端口 LISTEN 的 runner 进程集合与 registry 条目的 pid 一致（无孤儿进程）

      - id: lifecycle-07
        name: 输出通道契约（stdout 仅主产物）
        description: eprint → stderr、print_msg → stdout；查询类空态/not-found 走 stdout，过程反馈/警告/错误/清理/用法提示走 stderr；机器（--json）模式下 stdout 只允许 JSON 信封或单行 URL（HTTP-SERVER-CL005 / D1）
        priority: MUST
        scenarios:
          - name: 错误文案不污染 --json
            given: 目标路径不存在
            when: 执行 hs /nonexistent --json
            then:
              - stdout 可被 json.loads 解析（信封 success=false）
              - 错误文案在 stderr

          - name: 查询类空态保留 stdout
            given: 无任何运行中服务
            when: 执行 hs list
            then:
              - 「暂无运行中的服务」类空态文案在 stdout（非错误）
              - stderr 为空

      - id: lifecycle-08
        name: 目录级启动锁（同目录并发互斥）
        description: 临界区互斥（锁文件 ~/.http-server.cli/locks/<sha1(abs_path)[:16]>.json，O_CREAT|O_EXCL 原子获取 + finally 释放）；stale 四判据 + 负龄不判 stale；有效锁等待 ≤3.0s，就绪即幂等命中，超时 fail-closed（HTTP-SERVER-CL005 / D3）
        priority: MUST
        scenarios:
          - name: 并发启动只产生一个 runner
            given: 该目录无服务在运行
            when: 并发（5 线程 / 5 进程）执行 hs <dir> --url
            then:
              - registry 中该 path 仅 1 条
              - 只发生 1 次启动（无重复 runner / 无孤儿进程）
              - 其余调用幂等命中，退出码 0

          - name: html 入口与目录入口共用同一把锁
            when: 并发执行 hs index.html 与 hs <dir>
            then: 锁键为 html 提取后的最终目录（同一把锁，不重复启动）

          - name: 陈旧锁被清理
            given: 锁文件中的 pid 已死
            when: 执行 hs <dir>
            then: 判 stale 清锁后正常启动（退出码 0）

          - name: 有效锁 fail-closed
            given: 锁由活着的本 CLI 进程持有且该目录尚未就绪
            when: 执行 hs <dir>
            then:
              - stderr 提示「另一实例正在启动（pid …）」
              - 退出码 1，不启动第二个 runner
              - 他人锁文件不被删除

          - name: 用法错误优先于锁等待
            given: 他人持锁
            when: 执行 hs <dir> -p 70000
            then: 仍按用法错误退出 2（端口越界），不被锁等待掩盖

          - name: 判定 stale 时不留下孤儿
            given: registry 中存在该目录条目，pid 存活但端口始终未监听（启动失败）
            when: 执行 hs <dir>
            then:
              - 归属校验通过时先终止该进程组，再移除 registry 条目
              - stderr 输出 stale 提示（含 pid 与已终止说明）

          - name: 归属校验拦截误杀
            given: registry 登记的 pid 已被系统复用给无关进程（命令行不含 runner.py）
            when: 执行 hs <dir>
            then:
              - 不终止该进程，仅移除 registry 条目
              - stderr 说明「登记 pid 非本工具服务，仅清理登记」

          - name: stale 文案不污染 stdout
            given: registry 中存在死 pid 条目
            when: 执行 hs <dir> --json
            then:
              - stdout 首个非空字符为 { 且可被 json 解析
              - stale 文案出现在 stderr

  # ── 端口分配 ───────────────────────────────────────

  port-allocation:
    purpose: 自动检测端口占用并从默认端口递增分配空闲端口
    requirements:
      - id: port-01
        name: 默认端口优先
        description: 默认端口空闲时直接使用，不递增
        priority: MUST
        scenarios:
          - name: 默认端口空闲
            given: 端口 8080 未被占用
            when: 执行 hs start .
            then: 服务绑定 8080

      - id: port-02
        name: 自动递增
        description: 默认端口被占时自动递增寻找下一空闲端口
        priority: MUST
        scenarios:
          - name: 默认端口被占
            given: 端口 8080 被占用，8081 空闲
            when: 执行 hs start .
            then:
              - 服务绑定 8081
              - 输出"自动分配端口 8081"

      - id: port-03
        name: 无可用端口提示
        description: 连续递增至上限仍无空闲端口时应报错
        priority: SHOULD
        scenarios:
          - name: 所有端口被占
            given: 端口 8080-10000 全部被占用
            when: 执行 hs start .
            then: 输出"端口已全部被占用"

      - id: port-04
        name: 指定端口（-p/--port）
        description: CLI -p 优先于 config.port（一次性，不回写）；被占用 fail-closed 不漂移；越界 exit 2（HTTP-SERVER-CL003）
        priority: MUST
        scenarios:
          - name: 指定端口空闲
            given: 端口 8099 空闲，config.port=8080
            when: 执行 hs start . -p 8099
            then:
              - 服务绑定 8099（不漂移、不写回 config）
              - hs list --json 该条 port 为 8099

          - name: 指定端口被占用
            given: 端口 8080 已被其它服务占用
            when: 执行 hs start . -p 8080
            then:
              - stderr 输出占用者（PID/路径）与换端口提示
              - 不启动服务，退出码 1

          - name: 保留端口
            given: 8180（dashboard）/ 8181（mcp）为内置服务保留端口
            when: 执行 hs start . -p 8180
            then:
              - 输出保留端口提示（占用态报「正在使用，PID …」，空闲态提示 hs dashboard -p <port>）
              - 不启动服务，退出码 1

          - name: 区间越界
            given: 端口取值需在 1024-65535
            when: 执行 hs start . -p 99
            then:
              - 输出 "Port must be between 1024-65535"
              - 退出码 2

          - name: 超自动分配上限直绑
            given: -p 直绑不受自动漂移上限 MAX_PORT=10000 约束
            when: 执行 hs start . -p 20000
            then: 服务绑定 20000

          - name: 幂等优先于 -p 校验
            given: 该路径已运行在 8099
            when: 执行 hs start . -p 8099（或 -p 8180）
            then:
              - 返回既有端口（-p 被忽略，stderr 注记）
              - 不报「已被占用」/「保留端口」，退出码 0

      - id: port-05
        name: 端口探测语义（真实监听者 vs 残留态）
        description: 真实 LISTEN 端口一律判占用（含仅绑定 127.0.0.1 / LAN 地址的服务）；残留态端口（TIME_WAIT/FIN_WAIT_2）不判占用（HTTP-SERVER-CL004 / D1）
        priority: MUST
        scenarios:
          - name: 残留态端口不判占用
            given: 端口刚被 hs kill，连接处于 TIME_WAIT（无进程监听）
            when: 执行 hs <dir> -p <该端口>
            then:
              - 服务正常绑定该端口（不漂移、不报「已被占用」）

          - name: 真实监听端口仍判占用
            given: 端口 8080 上有进程处于 LISTEN（含仅绑定 127.0.0.1 的服务）
            when: 执行 hs <dir> -p 8080
            then:
              - stderr 输出占用者（PID 或端口占用者描述）
              - 不启动服务，退出码 1

          - name: 自动漂移不再被残留态触发
            given: config.port 对应端口仅剩 TIME_WAIT 残留（无监听者）
            when: 执行 hs <dir>
            then: 服务绑定 config.port 本身（不递增到下一端口）

  # ── Registry ───────────────────────────────────────

  registry:
    purpose: 持久化记录 port ↔ {path, pid, domain, started_at} 映射
    requirements:
      - id: reg-01
        name: 写入与持久化
        description: 服务启动后 registry 应即时写入磁盘 JSON
        priority: MUST
        scenarios:
          - name: 启动后写入
            given: 服务成功启动在 8080
            when: 读取 registry.json
            then:
              - servers 数组长度 > 0
              - 第一条记录的 port=8080

      - id: reg-02
        name: 找回已注册服务
        description: 已注册且存活的服务再次 start 应直接打开浏览器
        priority: SHOULD
        scenarios:
          - name: 重复启动
            given: 端口 8080 已注册且进程存活
            when: 再次执行 hs start .
            then: 输出"服务已在运行"并打开浏览器

      - id: reg-03
        name: 清除残留记录
        description: 进程已死但 registry 残留时自动清理
        priority: SHOULD
        scenarios:
          - name: 残留清理
            given: registry 有残留记录但进程已死
            when: 执行 hs start .
            then:
              - 输出"发现残留注册记录，清理后重新启动"
              - 旧记录被删除，新记录写入

  # ── 配置管理 ───────────────────────────────────────

  configuration:
    purpose: 默认端口和域名的持久化配置
    requirements:
      - id: cfg-01
        name: 默认配置
        description: 首次运行应生成默认配置
        priority: MUST
        scenarios:
          - name: 首次运行
            when: 执行 hs config
            then:
              - config.json 存在
              - port=8080
              - domain=localhost

      - id: cfg-02
        name: 修改默认端口
        description: set port 应修改默认端口并持久化
        priority: MUST
        scenarios:
          - name: 修改端口
            when: 执行 hs set port 3000
            then:
              - config.json 中 port=3000
              - 后续 start 从 3000 开始分配

      - id: cfg-03
        name: 修改域名
        description: set domain 应修改绑定域名并持久化
        priority: MUST
        scenarios:
          - name: 修改域名
            when: 执行 hs set domain 0.0.0.0
            then:
              - config.json 中 domain=0.0.0.0
              - 后续启动使用该域名

      - id: cfg-04
        name: 配置损坏保护
        description: config.json 损坏时应 fallback 到默认值
        priority: SHOULD
        scenarios:
          - name: 损坏配置
            given: config.json 内容不是合法 JSON
            when: 读取配置
            then: 使用默认值 8080/localhost

  # ── CLI 接口 ───────────────────────────────────────

  cli-interface:
    purpose: 命令行参数解析与帮助/版本显示
    requirements:
      - id: cli-01
        name: 帮助信息
        description: help / -h / --help 应显示完整用法
        priority: MUST
        scenarios:
          - name: help 命令
            when: 执行 hs help
            then: 输出包含所有子命令和使用示例

          - name: -h 标志
            when: 执行 hs -h
            then: 输出与 help 相同的内容

      - id: cli-02
        name: 版本信息
        description: version / -v / --version 应显示版本号
        priority: MUST
        scenarios:
          - name: version 命令
            when: 执行 hs version
            then: 输出 http-server v1.3.0

          - name: --version 标志
            when: 执行 hs --version
            then: 输出版本号

      - id: cli-03
        name: 未知命令
        description: 未知子命令应报错并显示帮助
        priority: MUST
        scenarios:
          - name: 未知命令
            when: 执行 hs unknown-command
            then:
              - 输出"未知命令"
              - 显示帮助信息

      - id: cli-04
        name: 未识别参数告警与顶层 flag 归位
        description: 未识别参数一律 stderr 告警（stdout / JSON 零污染、退出码不变）；取值型 flag 的值被 argparse 误判为命令名时归位回 start（HTTP-SERVER-CL003 / D6 / D8）
        priority: MUST
        scenarios:
          - name: 未知参数告警
            given: 用户输入近形参数 --prot
            when: 执行 hs . --prot 8080
            then:
              - stderr 输出「未识别参数（已忽略）」及 --prot 引导行
              - stdout 无该提示，退出码不变（0）

          - name: 顶层端口 flag 归位
            given: -p 的取值 8099 被 argparse 解析为命令名
            when: 执行 hs -p 8099
            then: 重组为 start 参数并生效（不再出现 Unknown command 8099）

          - name: 裸数字仍为未知命令
            when: 执行 hs 8089
            then:
              - 输出 Unknown command 8089
              - 退出码 1

          - name: html 通配白名单
            given: Shell 展开出多份 html 文件参数
            when: 执行 hs a.html b.html
            then: 不误报未识别参数（沿用取最近修改文件语义）

      - id: cli-05
        name: 取值型 flag 优先归位与 web 用法错误退出码
        description: 取值型 flag（-p/--port/-i/--index）在场时其重组分支先于路径快捷方式；hs web add/update 的用法错误统一 exit 2（HTTP-SERVER-CL004 / D2 / D3）
        priority: MUST
        scenarios:
          - name: -i 的值在 CWD 存在
            given: 当前目录存在 index.html，目标目录 /tmp/site 存在
            when: 执行 hs -i index.html -p 8095 /tmp/site
            then:
              - 重组为 start 参数（-i index.html -p 8095 /tmp/site）
              - 服务落在 /tmp/site（不回退到当前目录），-i 生效
              - registry 该条 path 为解析后的 /tmp/site

          - name: 无 flag 时的路径快捷方式不受影响
            given: 当前目录存在 index.html
            when: 执行 hs index.html
            then: 仍按路径快捷方式启动（等价 hs start index.html）

          - name: web 端口越界
            given: 端口取值需在 1024-65535
            when: 执行 hs web add demo --cmd true --port 99
            then:
              - stderr 输出 Port must be between 1024-65535
              - 不创建条目，退出码 2（修前为 0，属「软拒绝」）

          - name: web 端口互斥
            given: --port 与 --no-port 语义互斥
            when: 执行 hs web update demo --port 9001 --no-port
            then:
              - stderr 输出 --port and --no-port are mutually exclusive
              - 退出码 2

      - id: cli-06
        name: hs web 退出码三态
        description: 用法错误（缺必填 / 子命令名冲突 / 名已存在 / 非法 url·open / 无更新参数）exit 2；运行期失败（名不存在 / services 文件损坏 / 执行命令退出码非 0）exit 1；成功与「已运行」幂等 exit 0（HTTP-SERVER-CL005 / D2）
        priority: MUST
        scenarios:
          - name: 缺必填
            when: 执行 hs web add demo
            then:
              - stderr 输出 --cmd is required
              - 退出码 2

          - name: 名不存在（查询）
            when: 执行 hs web show nope
            then:
              - stderr 输出 not found
              - 退出码 1

          - name: 执行命令失败
            given: 注册的命令退出码非 0
            when: 执行 hs web demo --no-probe
            then:
              - stderr 输出 Cmd exited with code N
              - 退出码 1（修前为 0，且 --json 信封 success=true）

  # ── 智能首页跳转 ───────────────────────────────────

  smart-homepage:
    purpose: 首页访问时智能跳转到最近修改的 HTML 文件
    requirements:
      - id: home-01
        name: 存在 index.html
        description: 当目录存在 index.html 时正常返回
        priority: MUST
        scenarios:
          - name: 正常返回
            given: 目录存在 index.html
            when: 访问 /
            then: 正常返回 index.html 内容

      - id: home-02
        name: 重定向到最近修改
        description: 无 index.html 时重定向到最近修改的 HTML 文件
        priority: MUST
        scenarios:
          - name: 单个 html 文件
            given: 目录无 index.html，有 test.html
            when: 访问 /
            then:
              - 返回 302 重定向
              - Location: /test.html

          - name: 多个 html 文件
            given: 目录无 index.html，有 a.html、b.html（b.html 最近修改）
            when: 访问 /
            then:
              - 返回 302 重定向
              - Location: /b.html

          - name: 查询参数处理
            given: 目录无 index.html，有 test.html
            when: 访问 /?t=1781889346836
            then:
              - 返回 302 重定向
              - Location: /test.html

      - id: home-03
        name: 无 HTML 文件
        description: 无任何 HTML 文件时返回目录列表
        priority: MUST
        scenarios:
          - name: 返回目录列表
            given: 目录无任何 HTML 文件
            when: 访问 /
            then: 返回默认目录列表

  # ── 进程资源监控 ───────────────────────────────────

  resource-monitoring:
    purpose: 监控服务进程的 CPU、内存使用情况
    requirements:
      - id: res-01
        name: start 显示资源
        description: 启动服务时显示进程资源信息
        priority: MUST
        scenarios:
          - name: 显示资源信息
            given: 服务成功启动
            when: 执行 hs start .
            then:
              - 输出包含 CPU 使用率
              - 输出包含内存使用量
              - 输出包含启动时间

      - id: res-02
        name: list 显示资源
        description: 列出服务时显示每个服务的资源信息
        priority: MUST
        scenarios:
          - name: 显示所有服务资源
            given: registry 中有 2 个服务
            when: 执行 hs list
            then:
              - 每个服务显示 CPU 使用率
              - 每个服务显示内存使用量
              - 每个服务显示运行时长

      - id: res-03
        name: 时长计算
        description: 计算服务运行时长并格式化输出
        priority: MUST
        scenarios:
          - name: 分钟级时长
            given: 服务运行 5 分钟
            when: 执行 hs list
            then: '输出"时长: 5 分钟"'

          - name: 小时级时长
            given: 服务运行 2 小时
            when: 执行 hs list
            then: '输出"时长: 2 小时"'

  # ── 日志管理 ───────────────────────────────────────

  logging:
    purpose: 服务日志的持久化存储与清理
    requirements:
      - id: log-01
        name: 日志文件创建
        description: 服务启动时创建日志文件
        priority: MUST
        scenarios:
          - name: 创建日志文件
            given: 服务在端口 8080 启动
            when: 检查 ~/.http-server.cli/logs/8080.log
            then: 文件存在且可读取

      - id: log-02
        name: 日志文件删除
        description: 服务关闭时删除日志文件
        priority: MUST
        scenarios:
          - name: 删除日志文件
            given: 服务在端口 8080 运行
            when: 执行 hs kill 8080
            then: ~/.http-server.cli/logs/8080.log 文件被删除

      - id: log-03
        name: 首页跳转日志
        description: 首页智能跳转时输出日志
        priority: SHOULD
        scenarios:
          - name: 重定向日志
            given: 目录无 index.html，有 test.html
            when: 访问 /
            then: '日志输出"首页无 index.html，重定向到: test.html"'

  # ── 书签系统 ─────────────────────────────────────

  bookmark:
    purpose: 命名书签的注册、更新、查询、删除，支持组合键唯一与通配符首页
    requirements:
      - id: bm-01
        name: 注册书签
        description: bookmark add 应注册命名书签，path 默认当前目录
        priority: MUST
        scenarios:
          - name: 注册默认路径
            when: 执行 hs bookmark add alpha
            then:
              - 书签 alpha 注册到当前目录
              - 输出包含 Bookmark 'alpha'

          - name: 注册指定路径
            when: 执行 hs bookmark add alpha /tmp/project
            then: 书签 alpha 指向 /tmp/project

          - name: 名称与内置命令冲突
            when: 执行 hs bookmark add list
            then: 输出名称与内置命令冲突提示

      - id: bm-02
        name: 组合键唯一
        description: (path, index_page) 组合键唯一，同路径不同首页可并存
        priority: MUST
        scenarios:
          - name: 同路径不同首页
            given: 已注册 alpha 指向 /tmp/project（index=index.html）
            when: 执行 hs bookmark add beta /tmp/project -i app.html
            then: beta 注册成功，与 alpha 并存

          - name: 组合键冲突
            given: 已注册 alpha 指向 /tmp/project（index=index.html）
            when: 执行 hs bookmark add gamma /tmp/project -i index.html
            then:
              - 输出组合键冲突提示
              - 不覆盖已有书签

          - name: force 覆盖组合键
            given: 已注册 alpha 指向 /tmp/project（index=index.html）
            when: 执行 hs bookmark add delta /tmp/project -i index.html --force
            then: delta 注册成功，覆盖组合键冲突

      - id: bm-03
        name: 通配符首页
        description: -i 含 * 的 index_page 原样存储，运行时解析为最近修改文件
        priority: MUST
        scenarios:
          - name: 通配符存储
            when: 执行 hs bookmark add alpha /tmp/project -i 'snapshots/*.html'
            then: 书签 index_page 存原始 pattern

          - name: 字面量校验
            when: 执行 hs bookmark add alpha /tmp/project -i app.html
            then: 无效的 index_page 被拒绝，合法值保存

      - id: bm-04
        name: 更新与删除
        description: bookmark update/remove 应支持路径与首页修改及书签删除
        priority: MUST
        scenarios:
          - name: 更新路径
            given: 已注册 alpha
            when: 执行 hs bookmark update alpha /new/path
            then: 书签 alpha 路径更新为 /new/path

          - name: 删除书签
            given: 已注册 alpha
            when: 执行 hs bookmark remove alpha
            then: 书签 alpha 被删除

      - id: bm-05
        name: 损坏检测
        description: 书签文件损坏时应抛出 DataCorruptionError
        priority: SHOULD
        scenarios:
          - name: 损坏文件
            given: bookmarks.json 内容不是合法 JSON
            when: 执行 hs bookmark list
            then: 输出书签文件损坏提示

  # ── HTTP 服务增强 ─────────────────────────────────

  http-serving:
    purpose: Range 请求支持与 MIME 自动识别等 HTTP 服务增强能力
    requirements:
      - id: http-01
        name: Range 请求
        description: 非目录文件应支持 Range 请求，返回 206 Partial Content
        priority: MUST
        scenarios:
          - name: 完整文件响应
            given: 目录存在 video.mp4
            when: GET /video.mp4（无 Range 头）
            then:
              - 返回 200
              - 响应头含 Accept-Ranges: bytes

          - name: 部分内容响应
            given: 目录存在 video.mp4
            when: 'GET /video.mp4，Range: bytes=0-1023'
            then:
              - 返回 206 Partial Content
              - Content-Range 头正确

          - name: 起始位置请求
            given: 目录存在 video.mp4
            when: 'GET /video.mp4，Range: bytes=1024-'
            then: 返回 206，从 1024 字节开始

      - id: http-02
        name: MIME 自动识别
        description: 基于文件扩展名自动返回 Content-Type
        priority: MUST
        scenarios:
          - name: HTML 文件
            given: 目录存在 index.html
            when: GET /index.html
            then: Content-Type 为 text/html

          - name: 未知扩展名
            given: 目录存在 data.xyz
            when: GET /data.xyz
            then: Content-Type 为 application/octet-stream

  # ── 托管服务注册表 ───────────────────────────────

  registry-managed:
    purpose: 基础设施服务（dashboard、MCP SSE）的独立注册与生命周期管理
    requirements:
      - id: mgd-01
        name: 独立注册表
        description: 托管服务登记在 registry-managed.json，与用户服务分离
        priority: MUST
        scenarios:
          - name: 托管注册
            given: 启动 MCP SSE 服务
            when: 读取 registry-managed.json
            then: 包含该 MCP 服务条目

          - name: list 合并展示
            given: registry-managed.json 有托管服务
            when: 执行 hs list
            then: 托管服务带 🔧 标记展示

      - id: mgd-02
        name: kill-all 隔离
        description: kill-all 不应关闭托管服务
        priority: MUST
        scenarios:
          - name: 托管服务存活
            given: dashboard 运行中（托管）
            when: 执行 hs kill-all
            then: dashboard 仍在运行

  # ── Web Dashboard ─────────────────────────────────

  dashboard:
    purpose: 图形化管理面板的启动、查询与 REST API
    requirements:
      - id: dash-01
        name: 启动面板
        description: dashboard 命令应启动 Web 管理面板（默认 8180）
        priority: MUST
        scenarios:
          - name: 默认端口
            when: 执行 hs dashboard
            then: 面板监听 8180 端口

          - name: 指定端口
            when: 执行 hs dashboard -p 9000
            then: 面板监听 9000 端口

      - id: dash-02
        name: 语言切换
        description: 面板支持中英文切换
        priority: MUST
        scenarios:
          - name: 中文参数
            when: GET /?lang=zh
            then: 返回中文界面

          - name: 英文路由
            when: GET /en
            then: 返回英文界面

      - id: dash-03
        name: REST API
        description: 面板提供服务列表/状态/关闭等 REST API
        priority: MUST
        scenarios:
          - name: 服务列表
            when: GET /api/servers
            then: 返回 JSON 服务列表

          - name: 状态查询
            given: 端口 8080 有服务
            when: GET /api/status/8080
            then: 返回该服务状态 JSON

          - name: 健康检查
            given: 端口 8080 有服务
            when: GET /api/ping/8080
            then: 返回探活结果

      - id: dash-04
        name: 面板子命令
        description: dashboard stop/status/restart 应管理面板生命周期
        priority: MUST
        scenarios:
          - name: 停止面板
            given: dashboard 运行中
            when: 执行 hs dashboard stop
            then: 面板停止

          - name: 状态查询
            given: dashboard 运行中
            when: 执行 hs dashboard status
            then: 输出端口/PID/时长信息

      - id: dash-05
        name: restart 端口透传
        description: hs dashboard restart --port N 用 N 启动；未给 --port 沿用当前 entry['port']（不再硬编码 8180）；HTTP-SERVER-CL003 / D9a
        priority: MUST
        scenarios:
          - name: 指定端口重启
            given: dashboard 运行在 8280
            when: 执行 hs dashboard restart --port 8290
            then: 面板在 8290 重新启动

          - name: 无端口重启沿用现值
            given: dashboard 运行在 8280
            when: 执行 hs dashboard restart
            then: 面板仍在 8280 启动

          - name: 越界端口
            when: 执行 hs dashboard restart --port 99
            then:
              - 输出 "Port must be between 1024-65535"
              - 退出码 2

          - name: 未运行时不启动
            given: dashboard 未运行
            when: 执行 hs dashboard restart --port 8290
            then: 输出 "dashboard not running" 且不启动

  # ── MCP 集成 ──────────────────────────────────────

  mcp-integration:
    purpose: MCP Server 的启动、传输模式与工具调用
    requirements:
      - id: mcp-01
        name: 启动 MCP Server
        description: mcp 命令应启动 MCP Server，默认 SSE 后台模式
        priority: MUST
        scenarios:
          - name: 默认 SSE 模式
            when: 执行 hs mcp
            then: 后台 SSE 服务启动并登记托管注册表

          - name: stdio 模式
            when: 执行 hs mcp --transport stdio
            then: 前台 stdio 模式启动，不登记托管注册表

      - id: mcp-02
        name: 工具清单
        description: MCP Server 应暴露 6 个工具
        priority: MUST
        scenarios:
          - name: 工具完整
            when: 客户端调用 tools/list
            then: 返回 hs_list/hs_status/hs_start/hs_kill/hs_kill_all/hs_config 6 个工具

          - name: 初始化校验
            given: 客户端未发送 initialize
            when: 客户端调用 tools/list
            then: 拒绝请求

      - id: mcp-03
        name: 服务管理
        description: mcp stop/status/restart 应管理 MCP 生命周期
        priority: MUST
        scenarios:
          - name: 停止
            given: MCP SSE 运行中
            when: 执行 hs mcp stop
            then: MCP 服务停止

          - name: 状态
            given: MCP SSE 运行中
            when: 执行 hs mcp status
            then: 输出端口/PID 信息

  # ── JSON 输出 ─────────────────────────────────────

  json-output:
    purpose: 所有管理命令的统一 JSON 信封输出
    requirements:
      - id: json-01
        name: 统一信封
        description: --json 标志应输出 { success, command, data, error } 信封
        priority: MUST
        scenarios:
          - name: 成功响应
            when: 执行 hs list --json
            then: JSON 包含 success=true、command=list、data、error=null

          - name: 失败响应
            when: 执行 hs kill 99999 --json
            then: JSON 包含 success=false 与 error 描述

      - id: json-02
        name: 覆盖命令集
        description: 管理命令均应支持 --json
        priority: MUST
        scenarios:
          - name: 命令覆盖
            when: 依次执行 hs list/status/kill/kill-all/history/search/config/set/version --json
            then: 每个命令均输出 JSON 信封

          - name: bookmark 子命令
            when: 依次执行 hs bookmark add/list/show/update/remove --json
            then: 每个子命令均输出 JSON 信封

          - name: mcp/dashboard 子命令
            when: 依次执行 hs mcp status/stop/restart --json 与 hs dashboard status/stop/restart --json
            then: 每个子命令均输出 JSON 信封

      - id: json-03
        name: start 信封端口字段
        description: hs start --json 的 data 增 port 字段（新建与幂等命中两条路径一致；HTTP-SERVER-CL003 / D7）
        priority: MUST
        scenarios:
          - name: 新建启动
            when: 执行 hs start . -p 8099 --json
            then: 信封 data.port 为 8099

          - name: 幂等命中
            given: 该路径已在 8099 运行
            when: 再次执行 hs start . --json
            then: 信封 data.port 为 8099

  # ── URL 输出 ──────────────────────────────────────

  url-flag:
    purpose: 启动后仅输出完整 URL 的干净模式
    requirements:
      - id: url-01
        name: URL 输出
        description: --url 标志应仅输出完整 URL，与 --json 互斥
        priority: MUST
        scenarios:
          - name: 仅 URL
            given: 服务成功启动
            when: 执行 hs start . --url
            then: 仅输出 http://localhost:PORT 形式的 URL

          - name: 与 --json 互斥
            when: 执行 hs start . --url --json
            then: 提示互斥并遵循其一

  # ── 通配符解析 ────────────────────────────────────

  glob-resolution:
    purpose: index 首页与路径参数的通配符解析，取最近修改文件
    requirements:
      - id: glob-01
        name: index 通配符
        description: -i 含通配符时应解析为最近修改的匹配文件
        priority: MUST
        scenarios:
          - name: 最近文件
            given: 目录有 snapshots/a.html、snapshots/b.html（b 最近）
            when: 执行 hs start . -i 'snapshots/*.html'
            then: 首页为 snapshots/b.html

      - id: glob-02
        name: 路径通配符
        description: 路径参数含通配符时应解析为最近修改的匹配文件所在目录
        priority: MUST
        scenarios:
          - name: 路径解析
            given: /tmp/snapshots/ 有 a.html、b.html（b 最近）
            when: 执行 hs /tmp/snapshots/*.html
            then: 服务目录为 /tmp/snapshots，首页为 b.html

  # ── 数据目录迁移 ──────────────────────────────────

  data-migration:
    purpose: 旧数据目录 ~/.http-server-cli 到新目录 ~/.http-server.cli 的自动迁移
    requirements:
      - id: mig-01
        name: 自动迁移
        description: 首次运行时旧目录存在应自动迁移到新目录
        priority: MUST
        scenarios:
          - name: 迁移成功
            given: ~/.http-server-cli 存在且 ~/.http-server.cli 不存在
            when: 首次执行 hs 命令
            then:
              - 数据迁移到 ~/.http-server.cli
              - 旧目录移除

          - name: 复制兜底
            given: 旧目录存在且 move 失败
            when: 首次执行 hs 命令
            then: 使用复制兜底，迁移成功

          - name: 无旧目录
            given: ~/.http-server-cli 不存在
            when: 首次执行 hs 命令
            then: 直接使用新目录，不迁移

          - name: 迁移失败不中断
            given: 旧目录存在且迁移完全失败
            when: 首次执行 hs 命令
            then: 输出警告并继续使用新目录
